<svg xmlns="http://www.w3.org/2000/svg" class="figsvg" viewBox="0 0 1000 344" font-family="Inter, sans-serif">
  <defs>
    <marker id="pl-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7686"/>
    </marker>
    <marker id="pl-head-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/>
    </marker>
  </defs>

  <!-- groups -->
  <rect x="6" y="6" width="550" height="132" rx="14" fill="#EAF1F9" stroke="#9CC1E6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="22" y="31" font-size="17" font-weight="700" fill="#0B3C68">Traffic classification</text>
  <rect x="6" y="166" width="988" height="172" rx="14" fill="#EAF1F9" stroke="#9CC1E6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="22" y="191" font-size="17" font-weight="700" fill="#0B3C68">Decision and enforcement</text>

  <g font-size="16.5" fill="#33404F" text-anchor="middle">
    <!-- row 1 -->
    <rect x="20" y="44" width="235" height="82" rx="11" fill="#fff" stroke="#1F5C99" stroke-width="2.4"/>
    <text x="137.5" y="72" font-size="21" font-weight="700" fill="#0B3C68">ISCXVPN2016 flow</text>
    <text x="137.5" y="95">23 timing statistics</text>
    <text x="137.5" y="115">no payload, IP or port</text>

    <rect x="305" y="44" width="235" height="82" rx="11" fill="#fff" stroke="#D9822B" stroke-width="3.4"/>
    <text x="422.5" y="72" font-size="21" font-weight="700" fill="#B8661A">Random Forest</text>
    <text x="422.5" y="95">7 application classes</text>
    <text x="422.5" y="115">probabilities p(c | x)</text>

    <rect x="640" y="44" width="270" height="82" rx="11" fill="#fff" stroke="#1F5C99" stroke-width="2.4"/>
    <text x="775" y="72" font-size="21" font-weight="700" fill="#0B3C68">Trusted record</text>
    <text x="775" y="95">flow ID → predicted class ŷ</text>
    <text x="775" y="115">read-only for the agent</text>

    <!-- row 2 -->
    <rect x="20" y="210" width="190" height="84" rx="11" fill="#fff" stroke="#1F5C99" stroke-width="2.4"/>
    <text x="115" y="239" font-size="21" font-weight="700" fill="#0B3C68">Operator request</text>
    <text x="115" y="262">instruction + optional</text>
    <text x="115" y="282">untrusted note</text>

    <rect x="255" y="210" width="180" height="84" rx="11" fill="#fff" stroke="#1F5C99" stroke-width="2.4"/>
    <text x="345" y="239" font-size="21" font-weight="700" fill="#0B3C68">LLM agent</text>
    <text x="345" y="262">Llama-3.2-3B (4-bit)</text>
    <text x="345" y="282">one JSON tool call</text>

    <rect x="510" y="210" width="240" height="84" rx="11" fill="#fff" stroke="#1F5C99" stroke-width="2.4"/>
    <text x="630" y="239" font-size="21" font-weight="700" fill="#0B3C68">Deterministic gate</text>
    <text x="630" y="262">dispatch → schema/range →</text>
    <text x="630" y="282">identity → policy(ŷ)</text>

    <rect x="815" y="210" width="168" height="84" rx="11" fill="#fff" stroke="#1F5C99" stroke-width="2.4"/>
    <text x="899" y="239" font-size="21" font-weight="700" fill="#0B3C68">Simulator</text>
    <text x="899" y="262">held / allowed /</text>
    <text x="899" y="282">blocked / limited</text>
  </g>

  <!-- arrows -->
  <g stroke="#6B7686" stroke-width="2.4" fill="none" marker-end="url(#pl-head)">
    <line x1="255" y1="85" x2="303" y2="85"/>
    <line x1="540" y1="85" x2="638" y2="85"/>
    <line x1="210" y1="252" x2="253" y2="252"/>
    <line x1="435" y1="252" x2="508" y2="252"/>
    <line x1="750" y1="252" x2="813" y2="252"/>
    <line x1="705" y1="126" x2="705" y2="208"/>
    <line x1="650" y1="126" x2="436" y2="209"/>
  </g>
  <g font-size="15" font-style="italic" fill="#4B5563" text-anchor="middle">
    <text x="471.5" y="240">proposal</text>
    <text x="781.5" y="240">execute</text>
  </g>
  <g font-size="19" font-style="italic" fill="#4B5563">
    <text x="716" y="160">ŷ</text>
    <text x="560" y="160">ŷ</text>
  </g>

  <!-- retry: dashed path, solid head -->
  <path d="M630,294 L630,312 L345,312 L345,306" fill="none" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="345" y1="308" x2="345" y2="296" stroke="#D9822B" stroke-width="2.4" marker-end="url(#pl-head-o)"/>
  <text x="487" y="331" font-size="15" font-style="italic" fill="#B8661A" text-anchor="middle">rejection reason (one retry)</text>
</svg>
